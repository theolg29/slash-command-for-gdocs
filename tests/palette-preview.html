<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aperçu Slash Docs</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { background: #f8f9fa; font: 16px Arial, sans-serif; }
      .page { box-sizing: border-box; width: 720px; min-height: 900px; margin: 36px auto; padding: 74px 82px; background: #fff; box-shadow: 0 1px 5px rgba(60,64,67,.2); }
      #editor { min-height: 600px; color: #202124; outline: 0; }
    </style>
    <script>
      window.chrome = {
        storage: {
          sync: { get: (_defaults, callback) => callback({ enabled: true }) },
          onChanged: { addListener: () => {} }
        }
      };
    </script>
    <script src="../src/commands.js"></script>
    <script src="../src/docs-adapter.js"></script>
    <script src="../src/content.js" defer></script>
  </head>
  <body>
    <main class="page"><div id="editor" contenteditable="true"></div></main>
    <script>
      window.addEventListener("DOMContentLoaded", async () => {
        const action = new URLSearchParams(location.search).get("action");
        let executions = 0;
        if (action === "select" || action === "keyboard") {
          window.SlashDocsAdapter.createDocsAdapter = () => ({ execute: async () => { executions += 1; } });
        }
        const editor = document.getElementById("editor");
        editor.focus();
        if (action === "anchor" || action === "anchor-low") {
          const caret = document.createElement("div");
          caret.className = "kix-cursor-caret";
          caret.style.cssText = "position:fixed;left:110px;top:120px;width:1px;height:20px";
          if (action === "anchor-low") caret.style.top = "440px";
          document.body.appendChild(caret);
        }
        editor.dispatchEvent(new KeyboardEvent("keydown", { key: "/", bubbles: true, cancelable: true }));
        if (action === "anchor" || action === "anchor-low") {
          const host = document.getElementById("slash-docs-root");
          document.body.dataset.anchorPassed = String(host.style.getPropertyValue("--slash-left") === "110px" && host.style.getPropertyValue("--slash-top") === (action === "anchor-low" ? "466px" : "146px"));
        }
        if (action === "arrow") {
          editor.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowDown", bubbles: true, cancelable: true }));
        }
        if (action === "close") {
          editor.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
          const host = document.getElementById("slash-docs-root");
          document.body.dataset.paletteClosed = String(host === null);
          document.body.dataset.slashPreserved = String(editor.textContent === "/");
        }
        if (action === "outside") {
          editor.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true }));
          const host = document.getElementById("slash-docs-root");
          document.body.dataset.outsideClosed = String(host === null);
        }
        if (action === "select" || action === "keyboard") {
          const host = document.getElementById("slash-docs-root");
          const oldButton = host.shadowRoot.querySelector(".command");
          if (action === "select") oldButton.click();
          else editor.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
          await new Promise(resolve => setTimeout(resolve, 100));
          const detached = !host.isConnected && host.shadowRoot.querySelectorAll(".command").length === 0;
          oldButton.click();
          const arrow = new KeyboardEvent("keydown", { key: "ArrowDown", bubbles: true, cancelable: true });
          editor.dispatchEvent(arrow);
          const released = !arrow.defaultPrevented;
          editor.dispatchEvent(new KeyboardEvent("keydown", { key: "/", bubbles: true, cancelable: true }));
          const reopened = host.isConnected && host.shadowRoot.querySelectorAll(".command").length > 0;
          editor.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
          document.body.dataset.selectionPassed = String(detached && released && reopened && executions === 1 && !host.isConnected);
        }
      });
    </script>
  </body>
</html>
